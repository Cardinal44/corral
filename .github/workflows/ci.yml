name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then cc=gcc cxx=g++; else cc=clang cxx=clang++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=$cc -DCMAKE_CXX_COMPILER=$cxx
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: CORRAL_RACE=1 CORRAL_BUILD_DIR=$PWD/build bash scripts/run-integration.sh
